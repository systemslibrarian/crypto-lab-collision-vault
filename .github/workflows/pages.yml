name: Deploy to GitHub Pages

# One workflow, one gate. This lab used to split them: e2e.yml ran only the
# Playwright + axe suite on pull_request and owned the Dependabot auto-merge,
# while this file ran lint, the type-check, Vitest and the build as well. A bump
# only had to clear Playwright to merge itself, then the deploy could fail on
# main with nothing red on the PR. Now `deploy` and `dependabot-auto-merge` need
# the same `build` job, which runs everything either file ran (including the
# playwright-report upload e2e.yml kept), and e2e.yml is gone.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT a bare `pages`: with cancel-in-progress, a PR run would cancel a live
  # main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demos/collision-vault/package-lock.json

      - name: Install dependencies
        working-directory: demos/collision-vault
        run: npm install

      - name: Lint
        working-directory: demos/collision-vault
        run: npm run lint

      - name: Type-check
        working-directory: demos/collision-vault
        run: npx tsc --noEmit

      - name: Test
        working-directory: demos/collision-vault
        run: npx vitest run

      - name: Build
        working-directory: demos/collision-vault
        run: npx vite build

      - name: Install Playwright browser
        working-directory: demos/collision-vault
        run: npx playwright install --with-deps chromium

      # `npm run test:e2e` is `playwright test` -- the same command e2e.yml ran.
      - name: Accessibility gate (axe-core, WCAG A/AA)
        working-directory: demos/collision-vault
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: demos/collision-vault/playwright-report/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demos/collision-vault/dist

  deploy:
    needs: build
    # NOT `== 'push'`. That would also skip workflow_dispatch, which is the one
    # trigger the post-auto-merge deploy depends on: the dispatched run would
    # build, pass the gate, and skip this job, so the site would still never
    # update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: build` is the whole safety argument -- a bump can
  # merge itself only once this lab's entire PR gate went green, so the gate
  # decides rather than the version number. A major that actually breaks the
  # lab fails the gate and the PR stays open for a human.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
